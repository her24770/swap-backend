name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Solo se cancelan corridas viejas de PRs; un push a main nunca corta un deploy a la mitad.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auditoria-dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Auditar vulnerabilidades altas y críticas
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          {
            echo "## Auditoría de dependencias — backend"
            echo
            npm run audit:security
          } 2>&1 | tee npm-audit-backend.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publicar reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-backend-${{ github.run_id }}
          path: npm-audit-backend.txt
          if-no-files-found: error
          retention-days: 14

  lint-y-typecheck:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build

  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit

  pruebas-integracion:
    name: Pruebas de integración (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No se necesita Node en el runner: todo corre dentro de docker compose
      # (postgres-integration, redis-integration e integration-tests).
      - run: sh scripts/run-integration.sh

  zap-baseline:
    name: Escaneo DAST OWASP ZAP (Baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ejecutar escaneo OWASP ZAP baseline contra copia efímera
        run: |
          chmod +x security/zap/run-zap.sh
          bash security/zap/run-zap.sh ci-baseline
      - name: Publicar reporte de seguridad OWASP ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-baseline-${{ github.run_id }}
          path: security/zap/reports/ci-baseline/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy a producción
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [auditoria-dependencias, lint-y-typecheck, pruebas-unitarias, pruebas-integracion, zap-baseline]
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-produccion-backend
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # La llave solo puede ejecutar deploy/deploy-swap.sh en el servidor
      # (forced command); "backend" es el destino que recibe ese script.
      - name: Desplegar backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" backend

  # Staging (SWAP-673): cada push a develop con el CI en verde se despliega en el
  # ambiente de pruebas. Solo corre si el repo tiene la variable STAGING_ACTIVO=true
  # (Settings → Variables), que se crea cuando staging ya está instalado en el servidor.
  deploy-staging:
    name: Deploy a staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_ACTIVO == 'true'
    needs: [auditoria-dependencias, lint-y-typecheck, pruebas-unitarias, pruebas-integracion, zap-baseline]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging-backend
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Misma llave y mismo forced command que producción: "staging backend" lo
      # atiende deploy-staging.sh, que no toca nada de producción.
      - name: Desplegar backend en staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" staging backend

  version:
    name: Publicar versión
    # Solo después de un deploy correcto: una versión con nombre siempre
    # corresponde a algo que llegó a producción.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Crear el tag y el release de la versión desplegada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Este commit ya tiene versión; no se crea otra."
            exit 0
          fi
          VERSION="$(bash .github/scripts/siguiente-version.sh)"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          echo "### Versión publicada: $VERSION" >> "$GITHUB_STEP_SUMMARY"
