# Sitio de nginx para STAGING (SWAP-673). Instalar con:
#   sudo cp deploy/staging/nginx-swap-staging.conf /etc/nginx/sites-available/swap-staging
#   sudo ln -s /etc/nginx/sites-available/swap-staging /etc/nginx/sites-enabled/swap-staging
#   sudo nginx -t && sudo systemctl reload nginx
# Requisitos: registro DNS swap-staging.jhgo.online (proxied) en Cloudflare, y el
# filtro de IPs de Cloudflare ya instalado (deploy/servidor/nginx-swap-solo-cloudflare.sh).
# Usa el certificado de origen de Cloudflare, que cubre *.jhgo.online. El dominio es de
# un solo nivel a propósito: el SSL universal de Cloudflare no cubre swap.staging.jhgo.online.
# Recomendado: proteger el dominio con Cloudflare Access para que solo entre el equipo.
server {
    listen 80;
    server_name swap-staging.jhgo.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name swap-staging.jhgo.online;

    ssl_certificate /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    include snippets/cloudflare-solo.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
