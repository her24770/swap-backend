# Respaldos con pgBackRest en PRODUCCIÓN: capa OPCIONAL sobre docker-compose.prod.yml.
#
# Sin esta capa, producción usa el Postgres de siempre y no exige ninguna variable
# BACKUP_*. Con ella, Postgres se reemplaza por la imagen swap-postgres:16 (la misma
# base pgvector más pgBackRest), archiva sus WAL en R2 y un segundo contenedor
# programa los respaldos. NO se activa sola: ver deploy/README.md → Backups para el
# orden exacto (bucket y clave primero, stanza-create justo después del deploy).
#
# Uso manual:  docker compose -f docker-compose.prod.yml -f docker-compose.respaldos.yml ...
# El script de deploy la suma solo si existe /home/nandez/deploy/respaldos.activos.
#
# Requiere en el .env: BACKUP_R2_ACCOUNT_ID, BACKUP_R2_ACCESS_KEY_ID,
# BACKUP_R2_SECRET_ACCESS_KEY, BACKUP_R2_BUCKET_NAME y BACKUP_ENCRYPTION_KEY
# (openssl rand -base64 48; guardarla FUERA del servidor y no cambiarla después:
# queda atada al repositorio de respaldos).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    build:
      context: ./docker/postgres
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    image: swap-postgres:16
    environment:
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?Falta definir POSTGRES_USER en .env}
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_R2_BUCKET_NAME:?Falta definir BACKUP_R2_BUCKET_NAME en .env}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_R2_ACCOUNT_ID:?Falta definir BACKUP_R2_ACCOUNT_ID en .env}.r2.cloudflarestorage.com
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_R2_ACCESS_KEY_ID:?Falta definir BACKUP_R2_ACCESS_KEY_ID en .env}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_R2_SECRET_ACCESS_KEY:?Falta definir BACKUP_R2_SECRET_ACCESS_KEY en .env}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY:?Falta definir BACKUP_ENCRYPTION_KEY en .env}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=swap archive-push %p
      - -c
      - archive_timeout=60s
    volumes:
      - swap_postgres_socket:/var/run/postgresql

  postgres-backup:
    image: swap-postgres:16
    container_name: swap-postgres-backup
    restart: unless-stopped
    logging: *logging
    # Solo corre el programador de respaldos; el consumo real se mide al activarlo
    # (SWAP-664). Si pgBackRest necesita más durante un respaldo completo, subir aquí.
    mem_limit: 512m
    cpus: 0.5
    command: backup-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?Falta definir POSTGRES_USER en .env}
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_R2_BUCKET_NAME:?Falta definir BACKUP_R2_BUCKET_NAME en .env}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_R2_ACCOUNT_ID:?Falta definir BACKUP_R2_ACCOUNT_ID en .env}.r2.cloudflarestorage.com
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_R2_ACCESS_KEY_ID:?Falta definir BACKUP_R2_ACCESS_KEY_ID en .env}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_R2_SECRET_ACCESS_KEY:?Falta definir BACKUP_R2_SECRET_ACCESS_KEY en .env}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY:?Falta definir BACKUP_ENCRYPTION_KEY en .env}
      BACKUP_REPORT_ENVIRONMENT: ${BACKUP_REPORT_ENVIRONMENT:-production}
    volumes:
      - swap_postgres_data:/var/lib/postgresql/data:ro
      - swap_postgres_socket:/var/run/postgresql

volumes:
  swap_postgres_socket:
    name: swap_postgres_socket
