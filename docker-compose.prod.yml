# Configuración de PRODUCCIÓN (servidor Contabo, swap.jhgo.online).
# Es la que usa el deploy automático (deploy/deploy-swap.sh) al hacer push a main.
# No reemplaza a docker-compose.yml (desarrollo local). Diferencias clave:
#   - nombres de contenedor swap-* (el servidor aloja otros proyectos)
#   - volúmenes con nombre fijo swap_postgres_data / swap_redis_data: NO renombrar,
#     son los que contienen los datos reales; otro nombre crearía una base vacía
#   - la API solo escucha en 127.0.0.1 (el tráfico entra por nginx/Cloudflare)
# pgBackRest se ejecuta desde PostgreSQL y requiere BACKUP_R2_* y
# BACKUP_ENCRYPTION_KEY en el .env del servidor.
#
# Logs y recursos (SWAP-667, SWAP-671): el servidor aloja unos 25 contenedores de
# otros proyectos, así que cada servicio tiene su rotación de logs y un tope de
# memoria y CPU. Los topes son techos, no reservas. Consumo medido el 2026-10-25:
# embeddings 640 MB, frontend 87 MB, postgres 61 MB, api 58 MB, redis 11 MB.
# Ojo: cambiar estos valores recrea los contenedores en el siguiente deploy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    build:
      context: ./docker/postgres
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    image: swap-postgres:16
    container_name: swap-postgres
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta definir POSTGRES_DB en .env}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?Falta definir POSTGRES_USER en .env}
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_R2_BUCKET_NAME:?Falta definir BACKUP_R2_BUCKET_NAME en .env}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_R2_ACCOUNT_ID:?Falta definir BACKUP_R2_ACCOUNT_ID en .env}.r2.cloudflarestorage.com
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_R2_ACCESS_KEY_ID:?Falta definir BACKUP_R2_ACCESS_KEY_ID en .env}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_R2_SECRET_ACCESS_KEY:?Falta definir BACKUP_R2_SECRET_ACCESS_KEY en .env}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY:?Falta definir BACKUP_ENCRYPTION_KEY en .env}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=swap archive-push %p
      - -c
      - archive_timeout=60s
    volumes:
      - swap_postgres_data:/var/lib/postgresql/data
      - swap_postgres_socket:/var/run/postgresql
    # Sin mapeo de puertos al host: solo accesible dentro de la red interna de Docker (servicio "api").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: swap-postgres:16
    container_name: swap-postgres-backup
    restart: unless-stopped
    logging: *logging
    # Solo corre el programador de respaldos; el consumo real se mide al activarlo
    # (SWAP-664). Si pgBackRest necesita más durante un respaldo completo, subir aquí.
    mem_limit: 512m
    cpus: 0.5
    command: backup-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBACKREST_PG1_USER: ${POSTGRES_USER:?Falta definir POSTGRES_USER en .env}
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_R2_BUCKET_NAME:?Falta definir BACKUP_R2_BUCKET_NAME en .env}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_R2_ACCOUNT_ID:?Falta definir BACKUP_R2_ACCOUNT_ID en .env}.r2.cloudflarestorage.com
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_R2_ACCESS_KEY_ID:?Falta definir BACKUP_R2_ACCESS_KEY_ID en .env}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_R2_SECRET_ACCESS_KEY:?Falta definir BACKUP_R2_SECRET_ACCESS_KEY en .env}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY:?Falta definir BACKUP_ENCRYPTION_KEY en .env}
      BACKUP_REPORT_ENVIRONMENT: ${BACKUP_REPORT_ENVIRONMENT:-production}
    volumes:
      - swap_postgres_data:/var/lib/postgresql/data:ro
      - swap_postgres_socket:/var/run/postgresql

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: swap-redis
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    cpus: 0.5
    # maxmemory por debajo del tope del contenedor para que Redis rechace
    # escrituras antes de que el sistema lo mate. noeviction: Redis guarda la lista
    # de tokens revocados y los contadores del rate limiting; descartar claves
    # cuando se llene abriría una brecha de seguridad.
    command: redis-server --requirepass ${REDIS_PASSWORD:?Falta definir REDIS_PASSWORD en .env} --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction
    volumes:
      - swap_redis_data:/data
    # Sin mapeo de puertos al host: solo accesible dentro de la red interna de Docker (servicio "api").
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  embeddings:
    build:
      context: ./embeddings
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    container_name: swap-embeddings
    restart: unless-stopped
    logging: *logging
    # 2 GB: usa ~640 MB en reposo pero el arranque (carga del modelo) sube más.
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Mientras arranca se revisa cada 2 s: la API espera a que esté sano, y con
      # solo `interval` el primer chequeo llegaba a los 30 s (SWAP-634).
      start_period: 90s
      start_interval: 2s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    container_name: swap-backend
    restart: unless-stopped
    logging: *logging
    # 768 MB: usa ~60 MB en reposo; el margen es para renderizar PDFs de
    # certificaciones (pdf-to-img) y procesar imágenes subidas.
    mem_limit: 768m
    cpus: 2.0
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # La IP real del cliente llega por nginx y Cloudflare (ver src/autenticacion/proxyConfiable.ts).
      TRUST_PROXY: cloudflare
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EMBEDDINGS_SERVICE_URL: http://embeddings:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy

volumes:
  swap_postgres_data:
    name: swap_postgres_data
  swap_postgres_socket:
    name: swap_postgres_socket
  swap_redis_data:
    name: swap_redis_data
